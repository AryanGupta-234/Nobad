<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: qrc: data: blob:; script-src 'self' file: qrc: 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; worker-src blob: data:; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOBAD File Bridge - Monaco Code Editor Studio</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #09090c;
      color: #d4d4d8;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }
    /* Custom Raycast/Linear scrollbars for all elements & fallback textarea */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #09090c;
    }
    ::-webkit-scrollbar-thumb {
      background: #272738;
      border-radius: 4px;
      border: 2px solid #09090c;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f5a;
    }
    ::-webkit-scrollbar-thumb:active {
      background: #6366f1;
    }
    ::-webkit-scrollbar-corner {
      background: #09090c;
    }
    #editor-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    #fallback-textarea {
      display: block;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background: #09090c;
      color: #e4e4e7;
      border: none;
      outline: none;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      tab-size: 4;
      resize: none;
      white-space: pre;
      overflow-wrap: normal;
      overflow-y: auto;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    #loading {
      position: absolute;
      bottom: 12px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font: 11px system-ui, -apple-system, sans-serif;
      color: #818cf8;
      background: rgba(18, 18, 24, 0.9);
      border: 1px solid #2a2a3e;
      border-radius: 5px;
      padding: 4px 10px;
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="vendor/monaco/vs/loader.js"></script>
</head>
<body>
  <div id="editor-container"></div>
  <textarea id="fallback-textarea" spellcheck="false" placeholder="Loading editor..."></textarea>
  <div id="loading"><span>Initializing Monaco Editor Studio…</span></div>

  <script>
    (() => {
      const MONACO_BASE = 'vendor/monaco/';   // bundled with the app (issue #30); no CDN
      let bridge = null;
      let editor = null;
      let diffEditor = null;
      let model = null;
      let currentSessionId = 'default';
      let currentPayload = {};
      let suppressChange = false;
      let minimapEnabled = true;
      let changeTimer = null;
      let isMonacoReady = false;

      function hideLoading() {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => loading.style.display = 'none', 200);
        }
      }

      function defineVSCodeDarkTheme() {
        monaco.editor.defineTheme('vscode-studio-dark', {
          base: 'vs-dark',
          inherit: true,
          rules: [
            { token: 'comment', foreground: '6a9955', fontStyle: 'italic' },
            { token: 'keyword', foreground: '38bdf8', fontStyle: 'bold' },
            { token: 'string', foreground: '34d399' },
            { token: 'number', foreground: 'fbbf24' },
            { token: 'type', foreground: '4ec9b0' },
            { token: 'function', foreground: 'dcdcaa' },
            { token: 'variable', foreground: '9cdcfe' },
            { token: 'delimiter.bracket', foreground: 'ffd700' }
          ],
          colors: {
            'editor.background': '#09090c',
            'editor.foreground': '#f4f4f5',
            'editorLineNumber.foreground': '#52525b',
            'editorLineNumber.activeForeground': '#818cf8',
            'editorCursor.foreground': '#818cf8',
            'editor.selectionBackground': '#264f78',
            'editor.inactiveSelectionBackground': '#3a3d41',
            'editor.lineHighlightBackground': '#121218',
            'editorIndentGuide.background1': '#1e1e24',
            'editorIndentGuide.activeBackground1': '#6366f1',
            'editorWhitespace.foreground': '#27272a',
            'editorBracketMatch.background': '#00640022',
            'editorBracketMatch.border': '#6366f1',
            'editorWidget.background': '#121217',
            'editorWidget.border': '#1e1e24',
            'minimap.background': '#09090c',
            'scrollbar.shadow': '#00000000',
            'scrollbarSlider.background': '#272738',
            'scrollbarSlider.hoverBackground': '#3f3f5a',
            'scrollbarSlider.activeBackground': '#6366f180',
            'diffEditor.insertedTextBackground': '#10b98125',
            'diffEditor.removedTextBackground': '#f43f5e25'
          }
        });
      }

      function editorOptions(payload) {
        return {
          theme: 'vscode-studio-dark',
          language: payload.language || 'plaintext',
          readOnly: !!payload.readonly,
          automaticLayout: true,
          fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace",
          fontSize: 13,
          lineHeight: 21,
          fontLigatures: true,
          minimap: { enabled: minimapEnabled, maxColumn: 80, renderCharacters: false },
          smoothScrolling: true,
          cursorSmoothCaretAnimation: 'on',
          cursorBlinking: 'smooth',
          bracketPairColorization: { enabled: true, independentColorPoolPerBracketType: true },
          guides: { bracketPairs: true, indentation: true, highlightActiveIndentation: true },
          folding: true,
          foldingHighlight: true,
          showFoldingControls: 'mouseover',
          renderWhitespace: 'selection',
          scrollBeyondLastLine: false,
          overviewRulerBorder: false,
          padding: { top: 8, bottom: 8 },
          scrollbar: {
            vertical: 'auto',
            horizontal: 'auto',
            useShadows: false,
            verticalHasArrows: false,
            horizontalHasArrows: false,
            verticalScrollbarSize: 8,
            horizontalScrollbarSize: 8,
            arrowSize: 0,
            alwaysConsumeMouseWheel: true
          },
          mouseWheelScrollSensitivity: 1,
          fastScrollSensitivity: 5
        };
      }

      function scheduleChange(text) {
        clearTimeout(changeTimer);
        changeTimer = setTimeout(() => {
          if (bridge && currentSessionId) {
            if (typeof bridge.contentChangedFromWeb === 'function') {
              bridge.contentChangedFromWeb(currentSessionId, text);
            }
          }
        }, 80);
      }

      function installEditorEvents(instance) {
        instance.onDidChangeModelContent(() => {
          if (suppressChange || !model) return;
          scheduleChange(model.getValue());
        });
        instance.onDidChangeCursorPosition((event) => {
          if (bridge && currentSessionId && typeof bridge.cursorChangedFromWeb === 'function') {
            bridge.cursorChangedFromWeb(currentSessionId, event.position.lineNumber, event.position.column);
          }
        });
        instance.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
          if (bridge && currentSessionId && model && typeof bridge.saveFromWeb === 'function') {
            bridge.saveFromWeb(currentSessionId, model.getValue());
          }
        });
      }

      function wireFallbackEvents() {
        const fb = document.getElementById('fallback-textarea');
        if (!fb) return;
        fb.addEventListener('input', () => {
          if (bridge && currentSessionId) {
            scheduleChange(fb.value);
          }
        });
        fb.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            if (bridge && currentSessionId) {
              bridge.saveFromWeb(currentSessionId, fb.value);
            }
          }
        });
      }

      function loadDocument(payload) {
        currentPayload = payload || {};
        if (!payload || !payload.sessionId) {
          if (editor) editor.setValue('');
          const fb = document.getElementById('fallback-textarea');
          if (fb) fb.value = '';
          return;
        }

        currentSessionId = payload.sessionId;

        // Immediately update fallback textarea so code is visible within milliseconds
        const fb = document.getElementById('fallback-textarea');
        if (fb) {
          fb.value = payload.text || '';
          if (payload.readonly) {
            fb.setAttribute('readonly', 'true');
          } else {
            fb.removeAttribute('readonly');
          }
        }

        if (!isMonacoReady) {
          if (fb) fb.style.display = 'block';
          return;
        }

        const sameSession = model && editor;
        if (!sameSession) {
          if (editor) editor.dispose();
          if (model) model.dispose();
          document.getElementById('editor-container').innerHTML = '';
          const uri = monaco.Uri.file(payload.path || payload.title || payload.sessionId || 'file.txt');
          const content = (fb && fb.value) ? fb.value : (payload.text || '');
          model = monaco.editor.createModel(content, payload.language || 'plaintext', uri);
          editor = monaco.editor.create(document.getElementById('editor-container'), editorOptions(payload));
          editor.setModel(model);
          installEditorEvents(editor);
        } else {
          monaco.editor.setModelLanguage(model, payload.language || 'plaintext');
          editor.updateOptions({ readOnly: !!payload.readonly });
          const content = (fb && fb.value) ? fb.value : (payload.text || '');
          if (model.getValue() !== content) {
            suppressChange = true;
            model.setValue(content);
            suppressChange = false;
          }
        }
        if (fb) fb.style.display = 'none';
        editor.focus();
      }

      function setLanguage(lang) {
        if (model && isMonacoReady) {
          monaco.editor.setModelLanguage(model, lang);
        }
      }

      function showDiff(payload) {
        if (!payload || !isMonacoReady) return;
        if (editor) { editor.dispose(); editor = null; }
        if (diffEditor) { diffEditor.dispose(); diffEditor = null; }
        document.getElementById('editor-container').innerHTML = '';

        diffEditor = monaco.editor.createDiffEditor(document.getElementById('editor-container'), {
          theme: 'vscode-studio-dark',
          automaticLayout: true,
          readOnly: true,
          renderSideBySide: true,
          fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
          fontSize: 13,
          lineHeight: 21,
          scrollBeyondLastLine: false,
          scrollbar: {
            vertical: 'auto',
            horizontal: 'auto',
            useShadows: false,
            verticalHasArrows: false,
            horizontalHasArrows: false,
            verticalScrollbarSize: 8,
            horizontalScrollbarSize: 8,
            arrowSize: 0,
            alwaysConsumeMouseWheel: true
          }
        });

        const origModel = monaco.editor.createModel(payload.original || '', payload.language || 'plaintext');
        const modModel = monaco.editor.createModel(payload.modified || '', payload.language || 'plaintext');
        diffEditor.setModel({ original: origModel, modified: modModel });
      }

      function command(name) {
        if (!editor || !isMonacoReady) return;
        if (name === 'save') {
          if (bridge && currentSessionId && model) bridge.saveFromWeb(currentSessionId, model.getValue());
        } else if (name === 'format') {
          editor.getAction('editor.action.formatDocument')?.run();
        } else if (name === 'find') {
          editor.getAction('actions.find')?.run();
        } else if (name === 'replace') {
          editor.getAction('editor.action.startFindReplaceAction')?.run();
        } else if (name === 'gotoLine') {
          editor.getAction('editor.action.gotoLine')?.run();
        } else if (name === 'toggleMinimap') {
          minimapEnabled = !minimapEnabled;
          editor.updateOptions({ minimap: { enabled: minimapEnabled } });
        } else if (name === 'focus') {
          editor.focus();
        }
      }

      function connectBridge() {
        if (typeof QWebChannel === 'undefined' || typeof qt === 'undefined' || !qt.webChannelTransport) {
          setTimeout(connectBridge, 40);
          return;
        }
        new QWebChannel(qt.webChannelTransport, (channel) => {
          bridge = channel.objects.editorBridge || channel.objects.editorController;
          if (!bridge) {
            setTimeout(connectBridge, 40);
            return;
          }
          window._bridge = bridge;

          if (bridge.documentChanged) bridge.documentChanged.connect(loadDocument);
          if (bridge.commandRequested) bridge.commandRequested.connect(command);
          if (bridge.diffRequested) bridge.diffRequested.connect(showDiff);
          if (bridge.languageChanged) bridge.languageChanged.connect(setLanguage);

          if (typeof bridge.webReady === 'function') {
            bridge.webReady();
          }
        });
      }

      // 1. Immediately wire fallback textarea and connect Qt WebChannel
      wireFallbackEvents();
      connectBridge();

      // Auto-hide loading overlay after 3 seconds if network is slow/offline
      setTimeout(hideLoading, 3000);

      // 2. Initialize Monaco Loader asynchronously
      if (typeof require !== 'undefined') {
        require.config({ paths: { vs: MONACO_BASE + 'vs' } });
        require(['vs/editor/editor.main'], () => {
          isMonacoReady = true;
          defineVSCodeDarkTheme();
          hideLoading();
          if (currentPayload && currentPayload.sessionId) {
            loadDocument(currentPayload);
          }
        }, (err) => {
          console.warn('Monaco load failed or offline, running instant fallback mode:', err);
          hideLoading();
        });
      } else {
        hideLoading();
      }

      function revealLine(line) {
        if (!editor || !isMonacoReady) return;
        editor.revealLineInCenter(line);
        editor.setPosition({ lineNumber: line, column: 1 });
        editor.focus();
      }

      window.rfmEditor = { loadDocument, setLanguage, showDiff, command, revealLine, getEditor: () => editor };
    })();
  </script>
</body>
</html>
