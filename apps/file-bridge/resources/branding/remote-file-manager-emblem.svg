<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="embFileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="embServerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="embNeonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="embNeonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="embGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Server Blades (Right background layer) -->
  <g transform="translate(180, 75)">
    <rect x="0" y="0" width="180" height="248" rx="20" fill="url(#embServerGrad)" stroke="#27272a" stroke-width="2.5"/>
    
    <!-- Blade 1 -->
    <rect x="14" y="16" width="152" height="62" rx="12" fill="#141418" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="144" cy="47" r="5" fill="#38bdf8" filter="url(#embGlow)"/>
    <circle cx="125" cy="47" r="3.5" fill="#34d399"/>
    <rect x="26" y="38" width="80" height="5" rx="2.5" fill="#27272a"/>
    <rect x="26" y="50" width="55" height="4" rx="2" fill="#1f1f23"/>

    <!-- Blade 2 -->
    <rect x="14" y="92" width="152" height="62" rx="12" fill="#141418" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="144" cy="123" r="5" fill="#38bdf8" filter="url(#embGlow)"/>
    <circle cx="125" cy="123" r="3.5" fill="#34d399"/>
    <rect x="26" y="114" width="80" height="5" rx="2.5" fill="#27272a"/>
    <rect x="26" y="126" width="65" height="4" rx="2" fill="#1f1f23"/>

    <!-- Blade 3 -->
    <rect x="14" y="168" width="152" height="62" rx="12" fill="#141418" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="144" cy="199" r="5" fill="#38bdf8" filter="url(#embGlow)"/>
    <circle cx="125" cy="199" r="3.5" fill="#38bdf8" opacity="0.6"/>
    <rect x="26" y="190" width="80" height="5" rx="2.5" fill="#27272a"/>
    <rect x="26" y="202" width="45" height="4" rx="2" fill="#1f1f23"/>
  </g>

  <!-- Glowing Frosted Hologram File Document (Foreground Layer) -->
  <g transform="translate(45, 45)">
    <path d="M 18 0 L 158 0 L 214 56 L 214 286 A 18 18 0 0 1 196 304 L 18 304 A 18 18 0 0 1 0 286 L 0 18 A 18 18 0 0 1 18 0 Z"
          fill="url(#embFileGrad)"
          stroke="url(#embNeonIndigo)"
          stroke-width="3.5"
          filter="url(#embGlow)"/>

    <path d="M 158 0 L 158 48 A 8 8 0 0 0 166 56 L 214 56"
          fill="#141418"
          stroke="url(#embNeonIndigo)"
          stroke-width="3"/>

    <!-- Grid lines -->
    <line x1="36" y1="85" x2="180" y2="85" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="36" y1="130" x2="180" y2="130" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="36" y1="175" x2="180" y2="175" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="36" y1="220" x2="180" y2="220" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="80" y1="45" x2="80" y2="275" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="135" y1="45" x2="135" y2="275" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Terminal Prompt Chevron '> _' -->
    <path d="M 48 126 L 90 160 L 48 194"
          stroke="url(#embNeonCyan)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#embGlow)"/>
    <line x1="106" y1="194" x2="160" y2="194"
          stroke="url(#embNeonCyan)"
          stroke-width="10"
          stroke-linecap="round"
          filter="url(#embGlow)"/>

    <!-- Transfer Pulse -->
    <g transform="translate(36, 252)">
      <circle cx="10" cy="0" r="3.5" fill="#818cf8" opacity="0.6"/>
      <circle cx="28" cy="0" r="3.5" fill="#818cf8" opacity="0.8"/>
      <circle cx="46" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="64" cy="0" r="4.5" fill="#38bdf8" filter="url(#embGlow)"/>
      <circle cx="82" cy="0" r="5" fill="#22d3ee" filter="url(#embGlow)"/>
      <path d="M 100 -9 L 112 0 L 100 9" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
