[project]
name = "nobad-file-bridge"
version = "0.4.0"
description = "SSH/SFTP and FTP/FTPS file manager with terminals, an editor, sync, deployments and server tools."
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "PySide6>=6.7",
    "asyncssh>=2.14",
    "keyring>=25.0",
    "SQLAlchemy>=2.0",
    "chardet>=5.2",
    "aioftp>=0.27",
    "Pillow>=10.0",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "pywebview>=5.3",
    "qtpy>=2.4; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
future = [
    "paramiko>=3.4",
]

[project.scripts]
nobad-file-bridge = "app.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app_web",
    "app_web.handlers",
    "core",
    "core.connections",
    "credentials",
    "deployment",
    "editor",
    "file_ops",
    "security",
    "storage",
    "sync",
    "terminal",
    "transfers",
    "ui"
]

[tool.setuptools.package-data]
# The web UI's pages, styles, scripts and vendored xterm are data files next to app_web.
app_web = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/screens/*.js", "ui/vendor/xterm/*", "ui/brand/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

