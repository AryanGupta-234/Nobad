# NOBAD Find project metadata. CI installs from the hash-pinned requirements-lock.txt; keep the dependency list
# below in step with requirements.txt.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nobad-find"
dynamic = ["version"]
description = "NOBAD Find: private, offline search over your own files, by name, by the text inside and by meaning."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aryan Gupta and NOBAD contributors" }]
requires-python = ">=3.11,<3.12"
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3.11", "Private :: Do Not Upload"]
dependencies = [
  "pywebview==6.2.1",
  "sqlcipher3-wheels==0.5.7",
  "pypdf==6.21.4",
  "numpy==2.4.6",
  "onnxruntime==1.32.0",
  "tokenizers==0.23.3",
  "winrt-runtime==3.2.1",
  "winrt-Windows.Media.Ocr==3.2.1",
  "winrt-Windows.Graphics.Imaging==3.2.1",
  "winrt-Windows.Storage.Streams==3.2.1",
  "winrt-Windows.Globalization==4!10.0.28000.2957",
  "winrt-Windows.Foundation==3.2.1",
  "winrt-Windows.Foundation.Collections==3.2.1",
  "winrt-Windows.Storage==4!10.0.28000.2957",
  "winrt-Windows.Storage.FileProperties==4!10.0.28000.2957",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyflakes==4.1.0"]

[project.scripts]
nobad-find = "nobadfind.app:main"

[project.urls]
Source = "https://github.com/nobad-studio/Nobad-VPN"

[tool.setuptools.dynamic]
version = { attr = "nobadfind.const.APP_VER" }

[tool.setuptools.packages.find]
include = ["nobadfind*"]

[tool.setuptools.package-data]
nobadfind = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
