<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' qrc: https://unpkg.com data: blob:; script-src 'self' qrc: https://unpkg.com 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' https://unpkg.com 'unsafe-inline'; worker-src blob: data: https://unpkg.com; font-src 'self' data: https://unpkg.com; img-src 'self' data: blob:; connect-src 'self' https://unpkg.com;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote File Manager Editor</title>
  <style>
    html, body, #editor { width:100%; height:100%; margin:0; overflow:hidden; background:#080808; color:#cccccc; }
    #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:12px system-ui,sans-serif; color:#858585; background:#080808; z-index:3; }
    #offline { display:none; max-width:560px; padding:24px; line-height:1.5; text-align:center; }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="https://unpkg.com/monaco-editor@0.56.0/min/vs/loader.js" integrity="sha384-jwxunh5pHKFzi60XobDcwOM7qnk4lSGpdBU/hNn9pUGp+ZUpaHJqadNLRF2k+jPu" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div id="editor"></div>
  <div id="loading"><div id="offline">Loading Monaco Editor…</div></div>
  <script>
    (() => {
      const MONACO_BASE = 'https://unpkg.com/monaco-editor@0.56.0/min/';
      let bridge = null;
      let editor = null;
      let diffEditor = null;
      let model = null;
      let diffOriginalModel = null;
      let diffModifiedModel = null;
      let currentSessionId = '';
      let currentPayload = null;
      let suppressChange = false;
      let minimapEnabled = true;
      let changeTimer = null;

      function workerUrl() {
        const source = `self.MonacoEnvironment={baseUrl:${JSON.stringify(MONACO_BASE)}};importScripts(${JSON.stringify(MONACO_BASE + 'vs/base/worker/workerMain.js')});`;
        return `data:text/javascript;charset=utf-8,${encodeURIComponent(source)}`;
      }
      window.MonacoEnvironment = { getWorkerUrl: workerUrl };

      function showLoading(text) {
        const loading = document.getElementById('loading');
        loading.style.display = 'flex';
        document.getElementById('offline').textContent = text;
      }
      function hideLoading() { document.getElementById('loading').style.display = 'none'; }

      function defineTheme() {
        monaco.editor.defineTheme('rfm-dark', {
          base: 'vs-dark', inherit: true,
          rules: [],
          colors: {
            'editor.background': '#080808',
            'editor.foreground': '#CCCCCC',
            'editorLineNumber.foreground': '#6E7681',
            'editorLineNumber.activeForeground': '#C6C6C6',
            'editorCursor.foreground': '#AEAFAD',
            'editor.selectionBackground': '#264F78',
            'editor.inactiveSelectionBackground': '#3A3D41',
            'editor.lineHighlightBackground': '#0F0F0F',
            'editorIndentGuide.background1': '#202020',
            'editorIndentGuide.activeBackground1': '#3B3B3B',
            'editorWhitespace.foreground': '#404040',
            'editorBracketMatch.background': '#0064001A',
            'editorBracketMatch.border': '#888888',
            'editorWidget.background': '#202020',
            'editorWidget.border': '#454545',
            'editorSuggestWidget.background': '#202020',
            'editorSuggestWidget.border': '#454545',
            'editorSuggestWidget.selectedBackground': '#04395E',
            'editorHoverWidget.background': '#202020',
            'editorHoverWidget.border': '#454545',
            'editorFindMatch.background': '#515C6A',
            'editorFindMatchHighlight.background': '#EA5C0055',
            'minimap.background': '#080808',
            'scrollbarSlider.background': '#79797966',
            'scrollbarSlider.hoverBackground': '#646464B3',
            'scrollbarSlider.activeBackground': '#BFBFBF66',
            'diffEditor.insertedTextBackground': '#9CCC2C33',
            'diffEditor.removedTextBackground': '#FF000033'
          }
        });
      }

      function editorOptions(payload) {
        return {
          theme: 'rfm-dark',
          language: payload.language || 'plaintext',
          readOnly: !!payload.readonly,
          automaticLayout: true,
          fontFamily: "'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace",
          fontSize: 13,
          lineHeight: 20,
          fontLigatures: true,
          minimap: { enabled: minimapEnabled, maxColumn: 100, renderCharacters: false },
          smoothScrolling: true,
          cursorSmoothCaretAnimation: 'on',
          cursorBlinking: 'smooth',
          bracketPairColorization: { enabled: true, independentColorPoolPerBracketType: true },
          guides: { bracketPairs: true, indentation: true, highlightActiveIndentation: true },
          folding: true,
          foldingHighlight: true,
          showFoldingControls: 'mouseover',
          glyphMargin: true,
          renderWhitespace: 'selection',
          renderControlCharacters: true,
          stickyScroll: { enabled: true },
          inlineSuggest: { enabled: true },
          quickSuggestions: { other: true, comments: false, strings: true },
          suggest: { preview: true, showStatusBar: true },
          parameterHints: { enabled: true },
          formatOnPaste: false,
          formatOnType: false,
          mouseWheelZoom: true,
          multiCursorModifier: 'alt',
          wordWrap: 'off',
          padding: { top: 6, bottom: 8 },
          scrollBeyondLastLine: false,
          overviewRulerBorder: false,
          hideCursorInOverviewRuler: true
        };
      }

      function disposeEditors() {
        clearTimeout(changeTimer);
        if (editor) { editor.dispose(); editor = null; }
        if (diffEditor) { diffEditor.dispose(); diffEditor = null; }
        if (model) { model.dispose(); model = null; }
        if (diffOriginalModel) { diffOriginalModel.dispose(); diffOriginalModel = null; }
        if (diffModifiedModel) { diffModifiedModel.dispose(); diffModifiedModel = null; }
        document.getElementById('editor').innerHTML = '';
      }

      function scheduleChange(text) {
        const sessionAtChange = currentSessionId;
        clearTimeout(changeTimer);
        changeTimer = setTimeout(() => {
          if (bridge && sessionAtChange) bridge.contentChangedFromWeb(sessionAtChange, text);
        }, 120);
      }

      function installEditorEvents(instance) {
        instance.onDidChangeModelContent(() => {
          if (suppressChange || !model) return;
          scheduleChange(model.getValue());
        });
        instance.onDidChangeCursorPosition((event) => {
          if (bridge && currentSessionId) bridge.cursorChangedFromWeb(currentSessionId, event.position.lineNumber, event.position.column);
        });
        instance.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
          if (bridge && currentSessionId && model) bridge.saveFromWeb(currentSessionId, model.getValue());
        });
      }

      function loadDocument(payload) {
        currentPayload = payload || {};
        if (!payload || payload.empty || !payload.sessionId) {
          currentSessionId = '';
          disposeEditors();
          return;
        }
        const sameSession = currentSessionId === payload.sessionId && model && editor;
        currentSessionId = payload.sessionId;
        if (diffEditor) disposeEditors();
        if (!sameSession) {
          if (editor) editor.dispose();
          if (model) model.dispose();
          document.getElementById('editor').innerHTML = '';
          const uri = monaco.Uri.parse((payload.remote ? 'rfm-remote:///' : 'file:///') + encodeURIComponent(payload.path || payload.title || payload.sessionId));
          model = monaco.editor.createModel(payload.text || '', payload.language || 'plaintext', uri);
          editor = monaco.editor.create(document.getElementById('editor'), editorOptions(payload));
          editor.setModel(model);
          installEditorEvents(editor);
        } else {
          monaco.editor.setModelLanguage(model, payload.language || 'plaintext');
          editor.updateOptions({ readOnly: !!payload.readonly });
          if (model.getValue() !== (payload.text || '')) {
            suppressChange = true;
            model.setValue(payload.text || '');
            suppressChange = false;
          }
        }
        editor.focus();
      }

      function showDiff(payload) {
        if (!payload || !payload.sessionId) return;
        disposeEditors();
        currentSessionId = payload.sessionId;
        diffEditor = monaco.editor.createDiffEditor(document.getElementById('editor'), {
          theme: 'rfm-dark', automaticLayout: true, readOnly: true,
          renderSideBySide: window.innerWidth > 1000,
          fontFamily: "'Cascadia Code', 'JetBrains Mono', Consolas, monospace",
          fontSize: 13, lineHeight: 20, minimap: { enabled: false },
          scrollBeyondLastLine: false, originalEditable: false
        });
        diffOriginalModel = monaco.editor.createModel(payload.original || '', payload.language || 'plaintext');
        diffModifiedModel = monaco.editor.createModel(payload.modified || '', payload.language || 'plaintext');
        diffEditor.setModel({ original: diffOriginalModel, modified: diffModifiedModel });
      }

      function command(name) {
        const active = editor;
        if (name === 'save') {
          if (bridge && currentSessionId && model) bridge.saveFromWeb(currentSessionId, model.getValue());
          return;
        }
        if (name === 'focus') { if (active) active.focus(); return; }
        if (name === 'find') { if (active) active.getAction('actions.find').run(); return; }
        if (name === 'replace') { if (active) active.getAction('editor.action.startFindReplaceAction').run(); return; }
        if (name === 'gotoLine') { if (active) active.getAction('editor.action.gotoLine').run(); return; }
        if (name === 'format') { if (active) active.getAction('editor.action.formatDocument').run(); return; }
        if (name === 'toggleMinimap') {
          minimapEnabled = !minimapEnabled;
          if (active) active.updateOptions({ minimap: { enabled: minimapEnabled, maxColumn: 100, renderCharacters: false } });
        }
      }

      function connectBridge() {
        new QWebChannel(qt.webChannelTransport, (channel) => {
          bridge = channel.objects.editorController;
          bridge.documentChanged.connect(loadDocument);
          bridge.commandRequested.connect(command);
          bridge.diffRequested.connect(showDiff);
          bridge.webReady();
        });
      }

      if (!window.require) {
        showLoading('Monaco could not be loaded. Build the bundled editor assets or check network access.');
        return;
      }
      require.config({ paths: { vs: 'https://unpkg.com/monaco-editor@0.56.0/min/vs' } });
      showLoading('Loading Monaco Editor…');
      require(['vs/editor/editor.main'], () => {
        defineTheme();
        hideLoading();
        connectBridge();
      }, (error) => {
        console.error(error);
        showLoading('Monaco failed to load. Run the editor asset build for offline packaged use.');
      });

      window.rfmEditor = { loadDocument, showDiff, command };
    })();
  </script>
</body>
</html>
