name: NOBAD VPN release

# Builds the Windows installer from a version tag on a clean GitHub-hosted runner and publishes a GitHub Release
# with the installer, its SHA-256, the update manifest and the SBOM, plus a signed build-provenance attestation.
# Free for public repositories.
#   Release:  git tag vpn-v1.2.1 && git push origin vpn-v1.2.1
#   Dry run:  Actions tab -> "NOBAD VPN release" -> Run workflow (builds and uploads an artifact, no release)
#   Verify a download:  gh attestation verify NobadVPN-Setup-<version>.exe -R AryanGupta-234/Nobad
on:
  push:
    tags: ["vpn-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: VPN_dev
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Inno Setup (pinned)
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - name: Read the app version
        id: ver
        run: |
          $ver = (Select-String -Path nobadvpn\const.py -Pattern 'APP_VER = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "APP_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check the tag matches the app version and the changelog
        if: startsWith(github.ref, 'refs/tags/vpn-v')
        run: |
          if ("vpn-v$env:APP_VER" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match APP_VER $env:APP_VER" }
          $top = (Select-String -Path CHANGELOG.md -Pattern '^## (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          if ($top -ne $env:APP_VER) { throw "CHANGELOG.md's newest entry is $top, not $env:APP_VER" }

      - name: Build (tests, app, bundled WireGuard, installer, manifest, SBOM)
        env:
          NOBAD_RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          # Code signing: once SignPath (free for open source) is approved, sign between this step and the upload.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Release notes from CHANGELOG.md
        run: |
          python -c "import re,sys;s=open('CHANGELOG.md',encoding='utf-8').read();m=re.search(r'^## ' + re.escape(sys.argv[1]) + r'\b.*?(?=^## |\Z)', s, re.S|re.M);print(m.group(0) if m else 'See CHANGELOG.md')" $env:APP_VER | Out-File -Encoding utf8 dist-installer\release-notes.md

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nobad-vpn-installer
          path: VPN_dev/dist-installer/*
          retention-days: 30
          if-no-files-found: error

  publish:
    # Only this job can write to the repository, and it runs no build code: it attests and publishes the files
    # the build job produced.
    if: startsWith(github.ref, 'refs/tags/vpn-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # sign the provenance attestation (Sigstore)
      attestations: write    # store the attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nobad-vpn-installer
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.exe
            dist/*.sbom.json
            dist/latest.json

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          notes=dist/release-notes.md
          files=$(ls dist/* | grep -v release-notes.md)
          gh release create "${{ github.ref_name }}" $files -R "${{ github.repository }}" \
            --title "NOBAD VPN $VER" --notes-file "$notes" --verify-tag

      - name: Site entry for releases/vpn/releases.json
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### Add NOBAD VPN $VER to the website"
            echo "Run on your PC from the repository root, then commit and push:"
            echo '```'
            echo "python scripts/publish_vpn_release.py $VER \"<one-line summary>\""
            echo '```'
            echo "SHA-256: \`$(cut -d' ' -f1 dist/*.exe.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
