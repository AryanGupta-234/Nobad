name: NOBAD File Bridge tests

# Runs the NOBAD File Bridge unit tests. On pull requests it runs on EVERY PR and reports the
# "file-bridge-tests" check, which the main-branch ruleset requires: when a PR doesn't touch the app the
# check passes in seconds without testing; when it does, the full suite must pass. (A required check that
# never runs would block every unrelated PR.)
on:
  push:
    branches: [main]
    paths: ["apps/file-bridge/**", ".github/workflows/file-bridge-ci.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: file-bridge-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Does this change touch NOBAD File Bridge?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/file-bridge/|\.github/workflows/file-bridge-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No NOBAD File Bridge changes: nothing to test."
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnss3 libasound2t64

      - name: Install the app and test dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/file-bridge
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/file-bridge
        run: python -m pytest -q tests
