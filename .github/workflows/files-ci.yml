name: NOBAD Files tests

# Runs the NOBAD Files unit tests on every push and pull request that touches the app.
on:
  push:
    branches: [main]
    paths: ["apps/files/**", ".github/workflows/files-ci.yml"]
  pull_request:
    paths: ["apps/files/**", ".github/workflows/files-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: files-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/files
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libnss3 libasound2t64

      - name: Install the app and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q tests
