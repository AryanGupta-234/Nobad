name: NOBAD VPN tests

# Runs the app's unit tests and pyflakes on every push and pull request that touches the app, on the same
# Windows + Python 3.11 setup the release uses, with the hash-pinned dependencies.
on:
  push:
    branches: [main]
    paths: ["apps/vpn/**", ".github/workflows/vpn-ci.yml"]
  pull_request:
    paths: ["apps/vpn/**", ".github/workflows/vpn-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: apps/vpn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: pyflakes
        run: python -m pyflakes nobadvpn tests

      - name: Version and changelog agree
        run: |
          $ver = (Select-String -Path nobadvpn\const.py -Pattern 'APP_VER = "([^"]+)"').Matches[0].Groups[1].Value
          $top = (Select-String -Path CHANGELOG.md -Pattern '^## (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          if ($ver -ne $top) { throw "APP_VER $ver doesn't match the newest CHANGELOG.md entry $top" }
          "APP_VER $ver matches CHANGELOG.md"
