name: NOBAD VPN tests

# Runs the app's unit tests and pyflakes on the same Windows + Python 3.11 setup the release uses, with the
# hash-pinned dependencies. On pull requests it runs on EVERY PR and reports the "vpn-tests" check, so the ruleset
# can require it: when a PR doesn't touch the app the check passes in seconds; when it does, the suite must pass.
on:
  push:
    branches: [main]
    paths: ["apps/vpn/**", ".github/workflows/vpn-ci.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vpn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vpn-tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: apps/vpn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Does this change touch NOBAD VPN?
        id: scope
        shell: bash
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/vpn/|\.github/workflows/vpn-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No NOBAD VPN changes: nothing to test."
          fi

      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies (hash-checked)
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: python -m pytest -q tests

      - name: pyflakes
        if: steps.scope.outputs.run == 'true'
        run: python -m pyflakes nobadvpn tests

      - name: Version and changelog agree
        if: steps.scope.outputs.run == 'true'
        run: |
          $ver = (Select-String -Path nobadvpn\const.py -Pattern 'APP_VER = "([^"]+)"').Matches[0].Groups[1].Value
          $top = (Select-String -Path CHANGELOG.md -Pattern '^## (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          if ($ver -ne $top) { throw "APP_VER $ver doesn't match the newest CHANGELOG.md entry $top" }
          "APP_VER $ver matches CHANGELOG.md"
