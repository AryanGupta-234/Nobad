name: NOBAD Find tests

# Unit tests and pyflakes for apps/find on Windows (the app uses DPAPI, SQLCipher and Windows APIs), with the
# hash-pinned dependencies. On pull requests it runs on EVERY PR and reports the "find-tests" check, so the ruleset
# can require it: when a PR doesn't touch the app the check passes in seconds; when it does, the suite must pass.
on:
  push:
    branches: [main]
    paths: ["apps/find/**", ".github/workflows/find-ci.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: find-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: find-tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: apps/find
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Does this change touch NOBAD Find?
        id: scope
        shell: bash
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/find/|\.github/workflows/find-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No NOBAD Find changes: nothing to test."
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install pinned dependencies (hash-checked)
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: python -m pytest -q tests

      - name: pyflakes
        if: steps.scope.outputs.run == 'true'
        run: python -m pyflakes nobadfind tests

  build:
    # Builds the per-user installer (packaging/build.ps1: fresh venv, hash-pinned dependencies, tests, PyInstaller,
    # Inno Setup) and keeps it as a workflow artifact. Nothing is published: NOBAD Find isn't released yet.
    name: find-build
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: apps/find
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Does this change touch NOBAD Find?
        id: scope
        shell: bash
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/find/|\.github/workflows/find-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No NOBAD Find changes: nothing to build."
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install Inno Setup (pinned)
        if: steps.scope.outputs.run == 'true'
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - name: Build (tests, app, installer)
        if: steps.scope.outputs.run == 'true'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - name: Keep the installer as a workflow artifact
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nobad-find-installer
          path: apps/find/dist-installer/*
          retention-days: 14
          if-no-files-found: error
