name: NOBAD Find tests

# Unit tests and pyflakes for apps/find on Windows (the app uses DPAPI, SQLCipher and Windows APIs), with the
# hash-pinned dependencies.
on:
  push:
    branches: [main]
    paths: ["apps/find/**", ".github/workflows/find-ci.yml"]
  pull_request:
    paths: ["apps/find/**", ".github/workflows/find-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: find-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: apps/find
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pinned dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: pyflakes
        run: python -m pyflakes nobadfind tests
