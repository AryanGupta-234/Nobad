name: CLA

# AI co-authors ("Co-Authored-By: Claude ...") are allowlisted: the person who opens the PR signs for it.
# Asks each new contributor once to agree to CLA.md by commenting on their pull request, and records the signature
# in signatures/cla.json on the "cla-signatures" branch. It never checks out or runs the pull request's code, which
# is what makes pull_request_target safe here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write          # only to write the signatures file on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: AryanGupta-234,dependabot[bot],github-actions[bot],claude[bot],claude,Claude
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before it can be merged, please read the
            [NOBAD Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by commenting on this pull request with the sentence below. You only do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
