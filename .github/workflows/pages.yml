name: Validate and build NOBAD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static website
        run: npm run build
      - name: Validate release manifest
        run: python -m json.tool public/releases/vpn/releases.json > /dev/null
      - name: Verify generated routes and shared branding
        run: |
          test -s public/index.html
          test -s public/products/vpn/index.html
          test -s public/releases/vpn/releases.json
          test -s public/assets/README.md
          test -s public/assets/nobad-logo.png
          test -s public/assets/nobad-logo-light.png
          grep -qi '<title>nobad' public/index.html
          grep -qi 'nobad vpn' public/products/vpn/index.html
          grep -Fq 'src="/assets/nobad-logo-light.png"' public/products/vpn/index.html
          grep -Fq 'background: var(--k)' public/products/vpn/index.html
          grep -Fq 'border-radius: 999px' public/products/vpn/index.html
          python - <<'PY'
          from pathlib import Path
          logo = Path("public/assets/nobad-logo-light.png").read_bytes()
          assert logo[:8].hex() == "89504e470d0a1a0a", "invalid PNG"
          assert (int.from_bytes(logo[16:20], "big"), int.from_bytes(logo[20:24], "big")) == (1086, 362), "unexpected logo dimensions"
          assert logo[25] == 6, "logo must be RGBA with an alpha channel"
          print("Transparent VPN logo verified.")
          PY
