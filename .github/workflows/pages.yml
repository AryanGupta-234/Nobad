name: Validate and build NOBAD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static website
        run: npm run build
      - name: Validate release manifest
        run: python -m json.tool public/releases/vpn/releases.json > /dev/null
      - name: Verify generated routes
        run: |
          test -s public/index.html
          test -s public/products/vpn/index.html
          test -s public/releases/vpn/releases.json
          grep -qi '<title>nobad' public/index.html
          grep -qi 'nobad vpn' public/products/vpn/index.html
