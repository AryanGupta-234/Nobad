name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -s index.html
          test -s products/vpn/index.html
          python -m json.tool releases/vpn/releases.json > /dev/null
          grep -q '<title>NOBAD' index.html
          grep -q 'NOBAD VPN' products/vpn/index.html
