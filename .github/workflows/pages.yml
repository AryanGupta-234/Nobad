name: Validate and build NOBAD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Build static website
        run: npm run build
      - name: Validate release manifest
        run: python -m json.tool public/releases/vpn/releases.json > /dev/null
      - name: Verify generated pages
        run: |
          for f in index.html products/vpn/index.html code-signing-policy/index.html privacy/index.html support/index.html 404.html \
                   _headers robots.txt sitemap.xml favicon.ico releases/vpn/releases.json \
                   assets/nobad-logo.png assets/nobad-logo-light.png assets/og-image.png assets/legal.css; do
            test -s "public/$f" || { echo "missing public/$f"; exit 1; }
          done
          grep -Fq 'href="/code-signing-policy/"' public/index.html
          grep -Fq 'href="/privacy/"' public/index.html
          grep -Fq 'href="/support/"' public/index.html
          grep -Fq 'Code signing policy' public/code-signing-policy/index.html
          grep -Fq 'src="/assets/nobad-logo-light.png"' public/products/vpn/index.html
          grep -Fq 'Content-Security-Policy' public/_headers
          # internal files must not be published
          test ! -e public/docs && test ! -e public/assets/README.md
      - name: No stale or placeholder text
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          pub = pathlib.Path("public")
          m = json.loads((pub / "releases/vpn/releases.json").read_text(encoding="utf-8"))
          bad = []
          for p in pub.rglob("*.html"):
              s = p.read_text(encoding="utf-8")
              for pat in (r"\{\{[A-Z0-9_]+\}\}", r"\bv1\.0\b", "Replace the contact", "NO PUBLIC BUILD", "hello@nobad\.dev",
                          "No installer is linked", "official NOBAD contact channel", "replace with your"):
                  if re.search(pat, s):
                      bad.append(f"{p}: {pat}")
          for page in ("index.html", "products/vpn/index.html"):
              if m["latest"] not in (pub / page).read_text(encoding="utf-8"):
                  bad.append(f"{page}: doesn't show the latest version {m['latest']}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("pages are current")
          PY
