name: Feature idea
description: Suggest an improvement for NOBAD
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: principles
    attributes:
      label: NOBAD principles
      options:
        - label: It works without tracking users or sending new data to third parties (or makes that an explicit opt-in).
